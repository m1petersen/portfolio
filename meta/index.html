<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta - Codebase History</title>
  
  <script src="../global.js" type="module"></script>

  <link rel="stylesheet" href="../style.css"> 
  
  <script type="module" src="main.js"></script>
</head>
<body>
  <main>
    <h1>Meta: A History of My Code</h1>
    <p>Scroll down to see how this codebase evolved over time.</p>

    <div id="scrolly-1">
      <div id="scatter-story">
        </div>
      
      <div id="scatter-plot">
        <div id="stats"></div>
        <div id="chart"></div>
        
        <div id="selection-count">No commits selected</div>
        <dl id="language-breakdown"></dl>
      </div>
    </div>

    <div id="scrolly-2">
      <div id="file-story">
        </div>
      
      <div id="file-plot">
        <dl id="files"></dl>
      </div>
    </div>
  </main>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank"></a></dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="commit-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines Edited</dt>
    <dd id="commit-lines"></dd>
  </dl>

</body>
</html>
